color_scheme            auto

# Syntax highlighting engines tailored for each canvas
pygments_style          default
dark_pygments_style     monokai

# ==============================================================================
# LIGHT MODE CONFIG (Active when your terminal switches to #f8f8f8)
# ==============================================================================
background              #f8f8f8
foreground              #2a2b33

# Titles & Headers (Uses your crisp light-theme blue accent: #2f5af3)
title_fg                #2f5af3
title_bg                #f8f8f8

# Window Structure (Blends perfectly to keep layout uniform)
margin_bg               #f8f8f8
margin_fg               #bbbbbb
filler_bg               #f8f8f8
hunk_bg                 #f8f8f8
hunk_margin_bg          #f8f8f8

# Selection (Matches your explicit selection hex values)
select_bg               #e5e5e6
select_fg               #2a2b33

# Search Utilities
search_bg               #bbbbbb
search_fg               #2a2b33

# Diff Modifications (Soft pastels designed for dark text on a light canvas)
removed_bg              #ffeef0
highlight_removed_bg    #fdb8c0
removed_margin_bg       #f8f8f8

added_bg                #e6ffed
highlight_added_bg      #acf2bd
added_margin_bg         #f8f8f8


# ==============================================================================
# DARK MODE CONFIG (Preserves your seamless, blurred true-black layout)
# ==============================================================================
dark_background         black
dark_foreground         #dddddd

# Titles & Headers (Uses your dark-theme cyan accent)
dark_title_fg           cyan
dark_title_bg           black

# Window Structure
dark_margin_bg          black
dark_margin_fg          #444
dark_filler_bg          black
dark_hunk_bg            black
dark_hunk_margin_bg     black

# Selection
dark_select_bg          cyan
dark_select_fg          black

# Search Utilities
dark_search_bg          #444
dark_search_fg          white

# Diff Modifications (Rich deep tints designed for light text on a dark canvas)
dark_removed_bg         #4b0000
dark_highlight_removed_bg #7d0000
dark_removed_margin_bg  black

dark_added_bg           #003700
dark_highlight_added_bg #007d00
dark_added_margin_bg    black

